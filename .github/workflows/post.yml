name: Instagram paylaşımı

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Yalnızca bu öğeyi hemen paylaş (ör. g03). Boş: zamanı gelenler."
        required: false

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            config.json
            state
            tools
            content/plan.json
            content/media
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paylaş
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then python3 tools/post.py --run --only "$ONLY"; else python3 tools/post.py --run; fi
      - name: Paylaşım durumunu kaydet
        if: always()
        run: |
          git config user.name "kareyo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet || (git commit -m "Paylaşım durumu güncellendi" && git pull --rebase && git push)
