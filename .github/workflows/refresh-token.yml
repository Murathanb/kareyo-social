name: Instagram anahtarını yenile

# Instagram uzun ömürlü anahtarı 60 gün geçerli; haftada bir yenilenip depo sırrına yazılıyor.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Yenile ve kaydet
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          resp=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_ACCESS_TOKEN}")
          token=$(echo "$resp" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("access_token",""))')
          if [ -z "$token" ]; then echo "Yenileme başarısız: $(echo "$resp" | head -c 300)"; exit 1; fi
          echo "::add-mask::$token"
          gh secret set IG_ACCESS_TOKEN --body "$token" --repo "$REPO"
          echo "Anahtar yenilendi."
